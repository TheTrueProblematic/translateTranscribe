# ============================================================================
# LiveTranslate configuration
# Everything tunable lives here. Edit, then restart LiveTranslate.
# Values marked "tune in the room" are the ones worth touching mid-session.
# ============================================================================

[server]
host = "127.0.0.1"       # Loopback only. Never bind 0.0.0.0; this box does not serve the network.
port = 8420              # Display page + websocket both live here.
open_browser = true      # Launcher opens the display automatically.

[lmstudio]
base_url = "http://localhost:1234/v1"
model    = "hunyuan-mt2-1.8b-mlx"   # Benchmarked winner. Changing this changes latency AND quality.
temperature = 0.0
top_p = 1.0
seed = 7                            # Fixed seed => reproducible output for the same input.
max_tokens = 200                    # A spoken chunk never needs more. Caps runaway generation.
timeout_s = 20.0                    # Hard ceiling on one translation request.
context_lines = 2                   # Previous translated lines passed for pronoun/gender agreement.

[asr]
# MULTILINGUAL model (v3). With [dual] below, Portuguese spoken in the room is
# recognised AS Portuguese and translated back into English, instead of being
# mangled into plausible-sounding English that the gate then has to guess about.
# Measured: English accuracy matches the English-only v2, and Portuguese scores
# 0.00 on the English check instead of v2's ambiguous 0.30. See docs/REPORT.md.
# If you set [dual] enabled = false, prefer parakeet-tdt-0.6b-v2 instead.
model = "mlx-community/parakeet-tdt-0.6b-v3"
# Optional local weights directory (config.json + model.safetensors). If it
# exists it is used instead of downloading from Hugging Face, which makes
# startup offline and instant. Relative paths resolve from the project root.
model_path = "models/parakeet-tdt-0.6b-v3"
sample_rate = 16000

# Recognition runs as a rolling re-decode of a short window rather than through
# parakeet-mlx's StreamingParakeet, which is unusable for continuous audio in
# 0.5.2 (see the note at the top of livetranslate/asr.py). These two values set
# the accuracy/latency balance; measured 0.00-0.05 WER at the defaults.
decode_interval_ms = 500    # how often the window is re-decoded (~7% GPU duty)
stability_lag_ms   = 500    # a word must sit this far behind the live edge to
                            # be committed. Lower = snappier, more corrections.
context_seconds    = 2.0    # already-committed audio kept for decoding context
max_window_seconds = 24.0   # hard cap so cost stays flat in a 90 minute session

# The microphone is read in small blocks so the level meter and the
# voice-activity detector stay responsive.
mic_block_ms = 160

device = ""                 # "" = system default input. Set a name substring to pin the built-in mic.
# If no audio has arrived this many seconds after start, say so plainly.
# Opening the mic without macOS Microphone permission blocks forever rather
# than failing, so silence is otherwise indistinguishable from a quiet room.
mic_open_timeout_s = 6.0

[chunker]
# Emit a chunk on whichever fires FIRST. See spec section 6.
silence_ms = 400            # Voice-activity silence that closes a chunk.
max_words = 14              # Word count that closes a chunk.
max_elapsed_ms = 3500       # Wall-clock since last emit that closes a chunk.

[vad]
# Voice activity detection feeding the chunker's silence trigger.
energy_threshold = 0.008    # RMS above this counts as speech. Measured: a quiet room
                            # peaks around 0.0095, normal speech is far higher.
hangover_ms = 200           # Speech must be absent this long before silence is declared.

[gate]
# Tier 2 of the "reject other people's speech" stack (spec section 5).
# tune in the room ---------------------------------------------------------
# Mean ASR confidence below this => drop, when [dual] is DISABLED. In that mode
# confidence is the only thing separating the room's Portuguese from the
# speaker's English, so it stays strict. Measured: the speaker 0.921-0.998,
# English-looking Portuguese up to 0.823; 0.85 sits between them.
# See dual.min_confidence for the two-way mode, which can afford to be looser.
min_confidence = 0.85
min_english_score = 0.45       # English-ness 0..1 below this => drop. Measured: real English 0.57-0.94, garbled pt_BR 0.00-0.18.
min_words = 2               # Drop 1-word fragments; they are usually noise, not speech.
# --------------------------------------------------------------------------
log_rejections = true       # Rejected text goes to the debug log, NEVER to the display.

[gate.speaker]
# Tier 3. Disabled: see report / README for the measured reason.
enabled = false
threshold = 0.72            # Cosine similarity to the enrolled embedding.
enroll_seconds = 20

[hotkey]
# There is no global hotkey any more: it needed macOS Input Monitoring
# permission and was not worth the setup friction. Hold/resume is SPACE or P on
# the display window, and pausing now raises a full-width banner so it can
# never go unnoticed.
start_paused = false        # Leave false. True means nothing is displayed until you resume.

[display]
show_english_monitor = true # Small English strip at the bottom, for the speaker
                            # only. Press E on the display to hide it.

# --- Minimum reading time -------------------------------------------------
# A line is held on screen long enough to actually be read. If speech outruns
# reading, later lines wait their turn in a queue rather than flashing past,
# and the backlog bar along the bottom shows how far behind the display is.
#
# Dwell = lead_in + characters / reading_cps, clamped to [min, max].
# Subtitle practice puts adult reading around 15-17 characters per second; this
# is deliberately slower, because the audience is reading a translation while
# also listening to someone speak a language they may not follow.
reading_cps      = 13.5     # characters per second
dwell_lead_in_ms = 250      # time to notice the line changed at all
min_dwell_ms     = 1300     # even three words get a beat
max_dwell_ms     = 4500     # never hold longer than this, however long the line

# When the queue builds up, dwell is compressed toward min_dwell_ms so the
# display catches up on its own. At this backlog depth it is fully compressed.
catchup_backlog  = 6        # backlog depth at which compression is fully applied
catchup_floor    = 0.55     # never compress a line below this fraction of its
                            # own reading time -- catching up must not make a
                            # long sentence unreadable
backlog_bar_full = 8        # queue depth at which the backlog bar is full width
font_scale = 1.0            # Live-adjustable with + / - on the display page; persisted in the browser.
max_lines = 2               # Current line + previous line, per spec.
prev_opacity = 0.4          # Dimming of the previous line.
background = "#050506"
foreground = "#F5F5F7"

[dual]
# Two-way mode. The room is bilingual, so the recogniser is too.
#   English  -> Portuguese, shown in white, as always.
#   Portuguese -> English, shown in blue, so the speaker can read the reply and
#                 nobody mistakes it for a translation of their own words.
# Anything that is clearly neither language is dropped rather than guessed at.
enabled = true
portuguese_min = 0.30       # Portuguese-ness needed to route a line as Portuguese
margin = 0.10               # how far Portuguese must beat English to win the toss

# Confidence floor used INSTEAD of gate.min_confidence while dual mode is on.
# It can be much looser here, because deciding what is Portuguese is now the
# router's job rather than something inferred from how unsure the recogniser
# sounded. In a real session 447 lines were dropped at 0.85 and most were
# ordinary English; this should get them back.
min_confidence = 0.70

[transcript]
# Every run writes both languages to logs/transcripts/, so a session can be
# reviewed or scored afterwards. Two files per run: a readable .txt with the
# English above its Portuguese, and a .jsonl with timings, confidences and
# scores for evaluation. Both are flushed per line, so a hard quit loses nothing.
enabled = true
dir = "logs/transcripts"
include_rejected = true     # also record what the gate dropped, and why --
                            # that is the material you need to tune thresholds.

[logging]
dir = "logs"
level = "DEBUG"        # File log. DEBUG records every decode, word and gate decision.
max_bytes = 5000000         # Rolling debug log, 5 MB per file.
backups = 3

# ============================================================================
# Normalizer rules (spec section 7). Extend these freely.
# ============================================================================

[normalizer]
strip_disfluencies = true
collapse_repeats = true
convert_clock_times = true

# Spelled-out acronyms. ASR emits separated letters; rejoin them.
# Key is the letters as spoken (space separated, lowercase). Value is the output.
[normalizer.acronyms]
"i m u" = "IMU"
"l e d" = "LED"
"u s b" = "USB"
"g p s" = "GPS"
"r f"   = "RF"
"i p"   = "IP"
"a c"   = "AC"
"d c"   = "DC"
"e s c" = "ESC"
"p i d" = "PID"
"f p v" = "FPV"
"l i po" = "LiPo"
"r p m" = "RPM"
"c g"   = "CG"
"a o a" = "AOA"

# Split compound technical words the ASR breaks in two.
[normalizer.compounds]
"firm ware" = "firmware"
"fire wall" = "firewall"
"hard ware" = "hardware"
"soft ware" = "software"
"fuse large" = "fuselage"
"air frame" = "airframe"
"way point" = "waypoint"
"auto pilot" = "autopilot"
"gim bal" = "gimbal"
"prop eller" = "propeller"
"through put" = "throughput"
"band width" = "bandwidth"

# Truncation repair: ASR clips a word next to a known neighbour.
# "ver" next to firmware/software is really "version".
[normalizer.truncations]
"ver" = { full = "version", neighbours = ["firmware", "software"] }

# Words treated as standalone disfluencies and removed.
[normalizer.disfluencies]
words = ["um", "uh", "er", "erm", "ah", "hmm", "mm"]
